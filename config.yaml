# ==============================================================================
# Seafloor Magnetic Anomaly Detection ML Module Configuration
# Problem Statement ID: 26064
#
# NOTE: The numerical parameters below (background fields, noise levels, anomaly
# amplitudes, isolation forest hyperparameters, and score thresholds) are 
# SYNTHETIC DEVELOPMENT ASSUMPTIONS ONLY. They are designed for pipeline 
# verification before sea trials and MUST be re-calibrated when real ocean-bottom
# magnetometer sensor data is acquired.
# ==============================================================================

pipeline:
  random_seed: 42
  model_dir: "models"
  output_dir: "outputs/predictions"
  report_dir: "outputs/reports"

synthetic_generator:
  random_seed: 42
  num_samples: 2000
  grid_width: 100.0   # spatial dimension X (meters)
  grid_height: 100.0  # spatial dimension Y (meters)
  sensor_id: "SFS-001"
  start_timestamp: "2026-08-26T10:00:00"
  sample_interval_seconds: 1.0
  
  # Geomagnetic Background Simulation (arbitrary magnetic units / Gauss / µT)
  background_base: 0.45
  background_spatial_drift: 0.001  # spatial trend slope
  low_frequency_drift_std: 0.005
  sensor_noise_std: 0.015
  
  # Anomaly Parameters
  num_low_anomalies: 6
  low_anomaly_strength_min: 0.05
  low_anomaly_strength_max: 0.15
  low_anomaly_radius_min: 2.0
  low_anomaly_radius_max: 5.0
  
  num_high_anomalies: 3
  high_anomaly_strength_min: 0.40
  high_anomaly_strength_max: 1.20
  high_anomaly_radius_min: 4.0
  high_anomaly_radius_max: 8.0

preprocessing:
  baseline_window_size: 31    # rolling median window size (odd integer)
  baseline_min_periods: 5     # minimum non-null points required for rolling window
  handle_edge_cases: "reflect" # padding or edge treatment

features:
  selected_features:
    - "bx"
    - "by"
    - "bz"
    - "magnetic_signal"
    - "baseline_B"
    - "residual"
    - "normalized_deviation"
    - "rolling_mean"
    - "rolling_std"
    - "local_min"
    - "local_max"
    - "spatial_gradient_mag"

model:
  algorithm: "IsolationForest"
  n_estimators: 150
  contamination: 0.05       # expected proportion of high anomalies in synthetic baseline
  max_samples: 256
  random_state: 42

scoring:
  # Score threshold separating LOW_ANOMALY from HIGH_ANOMALY
  # score >= score_threshold -> high_anomaly
  # score < score_threshold -> low_anomaly
  score_threshold: 0.65
  normalization_method: "minmax"  # maps raw decision function to [0.0, 1.0]

sensor:
  # NOTE: The values below are development placeholders. Do NOT fabricate hardware specs.
  # Explicitly marked: UNKNOWN — REQUIRES HARDWARE SPECIFICATION
  sensor_model: "UNKNOWN — REQUIRES HARDWARE SPECIFICATION"
  measurement_unit: "arbitrary_magnetic_units"  # options: "arbitrary_magnetic_units", "microtesla", "nanotesla", "gauss"
  scale_factor: 1.0                              # Multiplier to standard processing unit; NO silent conversion
  sensor_range_min: -100.0                       # Placeholder physical sensor range minimum
  sensor_range_max: 100.0                        # Placeholder physical sensor range maximum
  nominal_sampling_rate_hz: 1.0                  # Placeholder sampling rate in Hz; do NOT assume 1 Hz for physical hardware
  resolution_bits: null                          # ADC resolution (bits) — UNKNOWN until hardware arrives
  nominal_noise_floor_std: 0.015                 # Placeholder noise floor std
  max_plausible_velocity_mps: 5.0                # Vehicle max plausible velocity (m/s) for coordinate discontinuity checks
  coordinate_unit: "meters"                      # Coordinate unit (meters)

quality_checks:
  max_dt_ratio_warning: 2.0                      # delta_t / nominal_dt threshold to flag irregular sampling
  max_spike_sigma: 5.0                           # 5-sigma local residual deviation threshold to flag magnetic spike
  min_flatline_samples: 5                        # consecutive identical values to flag sensor dropout/flatline

